name: Setup Droidspaces-OSS
description: Clone and apply Droidspaces-OSS patches with version-specific fixes
inputs:
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true
  android_version:
    description: 'Android version (e.g., android15)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.6)'
    required: true
  os_patch_level:
    description: 'OS patch level (e.g., 2024-07)'
    required: true
  sublevel:
    description: 'Kernel sublevel'
    required: true
  droidspaces_commit:
    description: 'Pinned Droidspaces-OSS commit (empty = main tip)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Download and Apply Droidspaces-OSS Patches
      uses: ./.github/actions/retry
      with:
        command: |
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git
        attempts: 5
        delay: 5
        workdir: ${{ github.workspace }}
        # A clone that dies mid-transfer leaves Droidspaces-OSS/ behind, and
        # the next attempt then fails instantly with "destination path already
        # exists" — so without this, all 5 attempts fail deterministically.
        cleanup: rm -rf Droidspaces-OSS

    - name: Pin Droidspaces-OSS to resolved commit
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        if [ -n "${{ inputs.droidspaces_commit }}" ]; then
          git -C Droidspaces-OSS fetch --depth=1 origin "${{ inputs.droidspaces_commit }}"
          git -C Droidspaces-OSS checkout "${{ inputs.droidspaces_commit }}"
          [ "$(git -C Droidspaces-OSS rev-parse HEAD)" = "${{ inputs.droidspaces_commit }}" ] || { echo "Droidspaces pin mismatch" >&2; exit 1; }
        fi

    - name: Apply the SYSVIPC kABI fix
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        if [ "${{ inputs.version }}" == "android16-6.12" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch ./
          patch -p1 < 001.GKI-6.12-or-above-fix_sysvipc_kabi.patch
        elif [ "${{ inputs.version }}" == "android15-6.6" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android14-6.1" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android14-5.15" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android13-5.15" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android12-5.10" ] || [ "${{ inputs.version }}" == "android13-5.10" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch ./
          patch -p1 < 002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
        fi

    - name: Apply cgroup limits kABI-safe patch (CPU/PIDs limits)
      shell: bash
      if: inputs.version == 'android15-6.6' || inputs.version == 'android14-6.1'
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        curl -fsSL -o ./fix_cgroup_limits_kabi.patch https://raw.githubusercontent.com/Goldzxcbug/sm8750_Droidspaces/main/droidspaces_patch/fix_cgroup_limits_kabi_6.6.89.patch
        if git apply --check ./fix_cgroup_limits_kabi.patch 2>/dev/null; then
          git apply ./fix_cgroup_limits_kabi.patch
          echo "[cgroupfix] patch applied (exact)"
        else
          patch -p1 -F 3 < ./fix_cgroup_limits_kabi.patch
          echo "[cgroupfix] patch applied (fuzz)"
        fi

    # Deliberately minimal. This list is exactly the delta between the stock
    # GKI config and the kernel that is known to boot on this device; nothing
    # else is forced on. Broad feature lists (IPVS, nftables, BTRFS, VXLAN,
    # IPVLAN, SCTP, extra cgroup controllers, AppArmor) are what made the
    # earlier builds hang at the boot logo, so they stay off.
    - name: Enable Droidspaces kernel configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_PID_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_DEVTMPFS=y
          CONFIG_USER_NS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_UDMABUF=y
          CONFIG_ZRAM_MULTI_COMP=y
          CONFIG_ZRAM_WRITEBACK=y

    - name: Fix BakaSU 6.6 selinux_hide static conflict
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        F=""
        for cand in common/drivers/kernelsu/feature/selinux_hide.c \
                    drivers/kernelsu/feature/selinux_hide.c \
                    common/drivers/kernelsu/selinux/selinux_hide.c; do
          if [ -f "$cand" ]; then F="$cand"; break; fi
        done
        if [ -z "$F" ]; then
          F="$(find -L . -path '*drivers/kernelsu*selinux_hide.c' 2>/dev/null | head -n 1)"
        fi
        if [ -z "$F" ]; then
          if [ -f BakaSU/kernel/feature/selinux_hide.c ]; then
            echo "[bakasu-fix] FATAL: BakaSU present but selinux_hide.c not resolvable" >&2
            ls -la drivers 2>/dev/null | head -n 20
            exit 1
          fi
          echo "[bakasu-fix] no BakaSU selinux_hide.c in this tree, nothing to do"
          exit 0
        fi
        echo "[bakasu-fix] target: $F"
        if ! grep -q 'security_context_to_sid_with_policy' "$F"; then
          echo "[bakasu-fix] helper not present, nothing to do"
          exit 0
        fi
        # Upstream declares this helper with one static-ness and defines it with
        # __maybe_static. On 6.6 the two disagree and clang rejects the pair:
        #   error: static declaration of 'security_context_to_sid_with_policy'
        #          follows non-static declaration
        # Rename the file-private copy so no kernel symbol can ever clash, then
        # force the prototype and the definition to plain `static`.
        sed -i 's/security_context_to_sid_with_policy/ksu_security_context_to_sid_with_policy/g' "$F"
        sed -i -E 's/^[[:space:]]*(__maybe_static[[:space:]]+)?int[[:space:]]+ksu_security_context_to_sid_with_policy/static int ksu_security_context_to_sid_with_policy/' "$F"
        echo "[bakasu-fix] declarations now:"
        grep -n 'ksu_security_context_to_sid_with_policy' "$F" | head -n 6
        if grep -qE '^[[:space:]]*(__maybe_static[[:space:]]+)?int[[:space:]]+ksu_security_context_to_sid_with_policy' "$F"; then
          echo "[bakasu-fix] FATAL: normalisation did not stick" >&2
          exit 1
        fi
