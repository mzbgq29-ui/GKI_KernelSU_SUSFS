name: Setup Droidspaces-OSS
description: Clone and apply Droidspaces-OSS patches with version-specific fixes
inputs:
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true
  android_version:
    description: 'Android version (e.g., android15)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.6)'
    required: true
  os_patch_level:
    description: 'OS patch level (e.g., 2024-07)'
    required: true
  sublevel:
    description: 'Kernel sublevel'
    required: true
  droidspaces_commit:
    description: 'Pinned Droidspaces-OSS commit (empty = main tip)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Download and Apply Droidspaces-OSS Patches
      uses: ./.github/actions/retry
      with:
        command: |
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git
        attempts: 5
        delay: 5
        workdir: ${{ github.workspace }}
        # A clone that dies mid-transfer leaves Droidspaces-OSS/ behind, and
        # the next attempt then fails instantly with "destination path already
        # exists" — so without this, all 5 attempts fail deterministically.
        cleanup: rm -rf Droidspaces-OSS

    - name: Pin Droidspaces-OSS to resolved commit
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        if [ -n "${{ inputs.droidspaces_commit }}" ]; then
          git -C Droidspaces-OSS fetch --depth=1 origin "${{ inputs.droidspaces_commit }}"
          git -C Droidspaces-OSS checkout "${{ inputs.droidspaces_commit }}"
          [ "$(git -C Droidspaces-OSS rev-parse HEAD)" = "${{ inputs.droidspaces_commit }}" ] || { echo "Droidspaces pin mismatch" >&2; exit 1; }
        fi

    - name: Apply the SYSVIPC kABI fix
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        if [ "${{ inputs.version }}" == "android16-6.12" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch ./
          patch -p1 < 001.GKI-6.12-or-above-fix_sysvipc_kabi.patch
        elif [ "${{ inputs.version }}" == "android15-6.6" ]; then
          #curl -L https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_1_2_3.patch
          #curl -L https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android14-6.1" ]; then
          #curl -L https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_1_2_3.patch
          #curl -L https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android14-5.15" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android13-5.15" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android12-5.10" ] || [ "${{ inputs.version }}" == "android13-5.10" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch ./
          patch -p1 < 002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
        fi

    - name: Export IPC symbols for module linkage
      shell: bash
      if: inputs.version == 'android16-6.12'
      working-directory: ${{ github.workspace }}/kernel
      run: |
        echo >> "${{ github.workspace }}/kernel/common/ipc/namespace.c"
        echo 'EXPORT_SYMBOL_GPL(put_ipc_ns);' >> "${{ github.workspace }}/kernel/common/ipc/namespace.c"
        echo >> "${{ github.workspace }}/kernel/common/ipc/msgutil.c"
        echo 'EXPORT_SYMBOL_GPL(init_ipc_ns);' >> "${{ github.workspace }}/kernel/common/ipc/msgutil.c"

    - name: Apply cgroup limits kABI-safe patch (CPU/PIDs limits)
      shell: bash
      if: inputs.version == 'android15-6.6' || inputs.version == 'android14-6.1'
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        curl -fsSL -o ./fix_cgroup_limits_kabi.patch https://raw.githubusercontent.com/Goldzxcbug/sm8750_Droidspaces/main/droidspaces_patch/fix_cgroup_limits_kabi_6.6.89.patch
        if git apply --check ./fix_cgroup_limits_kabi.patch 2>/dev/null; then
          git apply ./fix_cgroup_limits_kabi.patch
          echo "[cgroupfix] patch applied (exact)"
        else
          patch -p1 -F 3 < ./fix_cgroup_limits_kabi.patch
          echo "[cgroupfix] patch applied (fuzz)"
        fi

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_PID_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_BINFMT_MISC=y
          CONFIG_BINFMT_SCRIPT=y
          CONFIG_BINFMT_ELF=y
          CONFIG_USER_NS=y
          # [cgroupfix] IPv6 NAT for container NAT66
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          # [cgroupfix] CPU/PIDs limits (needs the kABI-safe patch above)

    - name: Enable all check-config.sh kernel features
      if: inputs.version == 'android15-6.6'
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          # Core namespaces, cgroups and security
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_PERF=y
          CONFIG_CGROUP_HUGETLB=y
          CONFIG_PERF_EVENTS=y
          CONFIG_HUGETLBFS=y
          CONFIG_HUGETLB_PAGE=y
          CONFIG_USER_NS=y
          CONFIG_KEYS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          # Bridge, VLAN and virtual network devices
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          # VLAN_8021Q must stay =m: Kleaf gki_aarch64_modules hard-requires
          # net/8021q/8021q.ko. BRIDGE_VLAN_FILTERING only needs a non-n dep.
          CONFIG_VLAN_8021Q=m
          CONFIG_BRIDGE_VLAN_FILTERING=y
          CONFIG_VXLAN=y
          CONFIG_IPVLAN=y
          CONFIG_MACVLAN=y
          CONFIG_DUMMY=y
          # IPv4/IPv6 iptables and NAT
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_MANGLE=y
          CONFIG_IP_NF_RAW=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_TARGET_REDIRECT=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_IP6_NF_RAW=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_NF_NAT_FTP=y
          CONFIG_NF_CONNTRACK_FTP=y
          CONFIG_NF_NAT_TFTP=y
          CONFIG_NF_CONNTRACK_TFTP=y
          # IPVS and its check-config schedulers
          CONFIG_IP_VS=y
          CONFIG_IP_VS_NFCT=y
          CONFIG_IP_VS_PROTO_TCP=y
          CONFIG_IP_VS_PROTO_UDP=y
          CONFIG_IP_VS_RR=y
          # nftables; 6.6 uses NFT_FIB_IPV4/IPV6 under NF_TABLES_IPV4/IPV6
          CONFIG_NF_TABLES=y
          CONFIG_NF_TABLES_IPV4=y
          CONFIG_NF_TABLES_IPV6=y
          CONFIG_NF_TABLES_INET=y
          CONFIG_NFT_CT=y
          CONFIG_NFT_FIB_IPV4=y
          CONFIG_NFT_FIB_IPV6=y
          CONFIG_NFT_FIB=y
          CONFIG_NFT_FIB_INET=y
          CONFIG_NFT_MASQ=y
          CONFIG_NFT_NAT=y
          # cgroup traffic classification and storage
          CONFIG_NET_CLS=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_CLS_CGROUP=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_BLK_CGROUP=y
          CONFIG_BLK_DEV_THROTTLING=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_IP_SCTP=y
          CONFIG_BTRFS_FS=y
          CONFIG_BTRFS_FS_POSIX_ACL=y
          CONFIG_FS_POSIX_ACL=y
          CONFIG_OVERLAY_FS=y
          CONFIG_EXT4_FS=y
          CONFIG_EXT4_FS_POSIX_ACL=y
          CONFIG_EXT4_FS_SECURITY=y
          CONFIG_EXT4_USE_FOR_EXT2=y
          # Keep SELinux first; compile AppArmor for the checker but do not
          # add it to Android's active LSM list (no apparmor_parser in userspace).
          CONFIG_SECURITY=y
          CONFIG_SECURITYFS=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_SECURITY_APPARMOR=y
          # Encrypted overlay networking checks
          CONFIG_CRYPTO=y
          CONFIG_CRYPTO_AEAD=y
          CONFIG_CRYPTO_GCM=y
          CONFIG_CRYPTO_SEQIV=y
          CONFIG_CRYPTO_GHASH=y
          CONFIG_XFRM=y
          CONFIG_XFRM_USER=y
          CONFIG_XFRM_ALGO=y
          CONFIG_INET_ESP=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y

    - name: Pin LSM order (keep SELinux ahead of AppArmor)
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        DEFCONFIG=arch/arm64/configs/gki_defconfig
        ORDER='landlock,lockdown,yama,loadpin,safesetid,selinux,tomoyo,bpf'
        # Enabling SECURITY_APPARMOR makes Kconfig default AppArmor ahead of
        # SELinux in CONFIG_LSM. That would hand early boot to an LSM with no
        # policy on Android, so pin the order explicitly.
        if grep -q '^CONFIG_LSM=' "$DEFCONFIG"; then
          sed -i "s|^CONFIG_LSM=.*|CONFIG_LSM=\"$ORDER\"|" "$DEFCONFIG"
        else
          echo "CONFIG_LSM=\"$ORDER\"" >> "$DEFCONFIG"
        fi
        grep -n '^CONFIG_LSM=' "$DEFCONFIG"

    - name: Fix BakaSU 6.6 selinux_hide static conflict
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        F=""
        for cand in common/drivers/kernelsu/feature/selinux_hide.c \
                    drivers/kernelsu/feature/selinux_hide.c \
                    common/drivers/kernelsu/selinux/selinux_hide.c; do
          if [ -f "$cand" ]; then F="$cand"; break; fi
        done
        if [ -z "$F" ]; then
          F="$(find -L . -path '*drivers/kernelsu*selinux_hide.c' 2>/dev/null | head -n 1)"
        fi
        if [ -z "$F" ]; then
          if [ -f BakaSU/kernel/feature/selinux_hide.c ]; then
            echo "[bakasu-fix] FATAL: BakaSU present but selinux_hide.c not resolvable" >&2
            ls -la drivers 2>/dev/null | head -n 20
            exit 1
          fi
          echo "[bakasu-fix] no BakaSU selinux_hide.c in this tree, nothing to do"
          exit 0
        fi
        echo "[bakasu-fix] target: $F"
        if ! grep -q 'security_context_to_sid_with_policy' "$F"; then
          echo "[bakasu-fix] helper not present, nothing to do"
          exit 0
        fi
        # Upstream declares this helper with one static-ness and defines it with
        # __maybe_static. On 6.6 the two disagree and clang rejects the pair:
        #   error: static declaration of 'security_context_to_sid_with_policy'
        #          follows non-static declaration
        # Rename the file-private copy so no kernel symbol can ever clash, then
        # force the prototype and the definition to plain `static`.
        sed -i 's/security_context_to_sid_with_policy/ksu_security_context_to_sid_with_policy/g' "$F"
        sed -i -E 's/^[[:space:]]*(__maybe_static[[:space:]]+)?int[[:space:]]+ksu_security_context_to_sid_with_policy/static int ksu_security_context_to_sid_with_policy/' "$F"
        echo "[bakasu-fix] declarations now:"
        grep -n 'ksu_security_context_to_sid_with_policy' "$F" | head -n 6
        if grep -qE '^[[:space:]]*(__maybe_static[[:space:]]+)?int[[:space:]]+ksu_security_context_to_sid_with_policy' "$F"; then
          echo "[bakasu-fix] FATAL: normalisation did not stick" >&2
          exit 1
        fi

